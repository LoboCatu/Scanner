<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Scanner Code128 PRO</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{
    margin:0;
    background:#0b2a4a;
    color:white;
    font-family:Arial;
    text-align:center;
}

h1{
    font-size:20px;
    margin:15px;
}

#reader{
    width:100%;
    max-width:450px;
    margin:auto;
    border-radius:10px;
    overflow:hidden;
}

button{
    padding:12px 18px;
    margin:10px 5px;
    border:none;
    border-radius:8px;
    font-size:16px;
    background:#1e88e5;
    color:white;
    cursor:pointer;
}

button:active{
    background:#1565c0;
}

.result{
    margin:15px;
    padding:15px;
    background:#123a63;
    border: 2px solid #1e88e5;
    border-radius:8px;
    font-size:20px;
    font-weight: bold;
    word-break:break-all;
    transition: background 0.2s ease;
}

/* Efecto visual rápido cuando escanea con éxito */
.flash-success {
    background: #1b5e20 !important;
}
</style>
</head>

<body>

<h1>Scanner PRO Code128</h1>

<div id="reader"></div>

<button onclick="startScanner()">📷 Iniciar</button>
<button onclick="stopScanner()">⛔ Stop</button>

<div class="result" id="output">
Resultado: -
</div>

<script>
let scanner = null;
let scanning = false;
let lastResult = "";
let audioCtx = null; // Guardamos el contexto de audio globalmente

// Inicializa el audio con el primer toque del usuario para saltar el bloqueo del navegador
function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}

function onScanSuccess(decodedText){
    if(!decodedText) return;

    // Filtro anti duplicados
    if(decodedText === lastResult) return;

    // Filtro anti basura (Letras, números y guiones entre 4 y 40 caracteres)
    if(!/^[A-Z0-9\-]{4,40}$/i.test(decodedText)) return;

    lastResult = decodedText;

    // MOSTRAR EN PANTALLA: Actualizar el contenedor con el código detectado
    const outputDiv = document.getElementById("output");
    outputDiv.innerText = "Código: " + decodedText;
    
    // Efecto visual: parpadeo verde en el cuadro de texto
    outputDiv.classList.add("flash-success");
    setTimeout(() => outputDiv.classList.remove("flash-success"), 300);

    // Feedback táctil (Vibración de 120 milisegundos)
    if(navigator.vibrate){
        navigator.vibrate(120);
    }

    // HACER BIP: Sonido electrónico instantáneo
    playBeep();

    console.log("Código detectado:", decodedText);

    // Enviar datos a Google Apps Script
    fetch("https://script.google.com/macros/s/AKfycbz1V555JQEXKW2lYQ-eVqWoXLaijVH4bthANLYdhWUzrsgtCkit0rZukCwgNP_9oEz2/exec", {
        method: "POST",
        mode: "no-cors", 
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            codigo: decodedText
        })
    })
    .then(() => console.log("Enviado con éxito"))
    .catch(err => console.error("Error al enviar:", err));
}

function onScanFailure(error){
    // Silencioso
}

// Función optimizada para el BIP electrónico (agudo y corto, estilo caja de supermercado)
function playBeep() {
    try {
        initAudio();
        
        // Si el navegador había pausado el audio por inactividad, lo reactivamos
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }

        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();

        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(1000, audioCtx.currentTime); // 1000Hz es un tono agudo y limpio
        gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime); // Volumen intermedio

        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        oscillator.start();
        oscillator.stop(audioCtx.currentTime + 0.08); // Duración de 80 milisegundos (un bip rápido)
    } catch (e) {
        console.log("Error al reproducir el bip:", e);
    }
}

async function startScanner(){
    if(scanning) return;
    
    // Activamos el motor de audio justo cuando el usuario presiona "Iniciar"
    initAudio();
    
    document.getElementById("output").innerText = "Solicitando permisos de cámara...";

    try {
        const devices = await Html5Qrcode.getCameras();
        
        if (!devices || devices.length === 0) {
            document.getElementById("output").innerText = "No se encontraron cámaras.";
            return;
        }

        let cameraId = devices[0].id;
        for (let device of devices) {
            const label = device.label.toLowerCase();
            if (label.includes("back") || label.includes("trasera") || label.includes("environment") || label.includes("0, back")) {
                cameraId = device.id;
                break;
            }
        }

        if (!scanner) {
            scanner = new Html5Qrcode("reader");
        }

        scanning = true;
        document.getElementById("output").innerText = "Iniciando cámara...";

        const config = {
            fps: 20,
            qrbox: {
                width: 280,
                height: 120
            },
            aspectRatio: 1.777,
            disableFlip: true,
            formatsToSupport: [
                Html5QrcodeSupportedFormats.CODE_128
            ],
            experimentalFeatures: {
                useBarCodeDetectorIfSupported: true
            }
        };

        await scanner.start(
            cameraId,
            config,
            onScanSuccess,
            onScanFailure
        );

        document.getElementById("output").innerText = "Scanner listo. Apunte a un código 128.";

    } catch (err) {
        console.error(err);
        scanning = false;
        document.getElementById("output").innerText = "Error al iniciar: " + err;
    }
}

function stopScanner(){
    if(scanner && scanning){
        scanner.stop()
        .then(()=>{
            scanning = false;
            lastResult = ""; 
            document.getElementById("output").innerText = "Scanner detenido";
        })
        .catch(err=>{
            console.log("Error al detener:", err);
        });
    }
}
</script>

</body>
</html>
