<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Scanner DNI Argentina</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{
    margin:0;
    background:#0b2a4a;
    color:white;
    font-family:Arial;
    text-align:center;
}

h1{
    font-size:20px;
    margin:15px;
}

#reader{
    width:100%;
    max-width:450px;
    margin:auto;
    border-radius:10px;
    overflow:hidden;
}

button{
    padding:12px 18px;
    margin:10px 5px;
    border:none;
    border-radius:8px;
    font-size:16px;
    background:#1e88e5;
    color:white;
    cursor:pointer;
}

button:active{
    background:#1565c0;
}

.result{
    margin:15px;
    padding:15px;
    background:#123a63;
    border: 2px solid #1e88e5;
    border-radius:8px;
    font-size:16px;
    font-weight: bold;
    word-break: break-all;
    transition: background 0.2s ease;
}

.flash-success {
    background: #1b5e20 !important;
}
</style>
</head>

<body>

<h1>Scanner DNI Argentina</h1>

<div id="reader"></div>

<button onclick="startScanner()">📷 Iniciar</button>
<button onclick="stopScanner()">⛔ Stop</button>

<div class="result" id="output">
Resultado: -
</div>

<script>
let scanner = null;
let scanning = false;
let lastResult = "";
let audioCtx = null;

function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}

function onScanSuccess(decodedText){
    if(!decodedText || decodedText === lastResult) return;

    // Lógica nueva: Contar cuántos "@" hay en el resultado
    const countAt = (decodedText.match(/@/g) || []).length;

    lastResult = decodedText;

    const outputDiv = document.getElementById("output");
    outputDiv.innerText = "Datos: " + decodedText;
    
    outputDiv.classList.add("flash-success");
    setTimeout(() => outputDiv.classList.remove("flash-success"), 300);

    if(navigator.vibrate) navigator.vibrate(120);
    playBeep();

    // Enviar a Google
    fetch("https://script.google.com/macros/s/AKfycbz1V555JQEXKW2lYQ-eVqWoXLaijVH4bthANLYdhWUzrsgtCkit0rZukCwgNP_9oEz2/exec", {
        method: "POST",
        mode: "no-cors", 
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ codigo: decodedText })
    }).catch(err => console.error(err));

    // Si detecta 8 arrobas, detenemos el scanner automáticamente
    if (countAt >= 8) {
        console.log("DNI detectado (8+ arrobas). Deteniendo...");
        outputDiv.innerText = "DNI capturado con éxito:\n" + decodedText;
        stopScanner(); // Esto detiene la cámara
    }
}

function onScanFailure(error){}

function playBeep() {
    try {
        initAudio();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(1000, audioCtx.currentTime);
        gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        oscillator.start();
        oscillator.stop(audioCtx.currentTime + 0.08);
    } catch (e) {}
}

async function startScanner(){
    if(scanning) return;
    initAudio();
    
    document.getElementById("output").innerText = "Iniciando...";

    try {
        const devices = await Html5Qrcode.getCameras();
        if (!devices || devices.length === 0) return;

        let cameraId = devices[0].id;
        for (let device of devices) {
            if (device.label.toLowerCase().includes("back")) {
                cameraId = device.id;
                break;
            }
        }

        if (!scanner) scanner = new Html5Qrcode("reader");

        scanning = true;

        // CONFIGURACIÓN PARA PDF417 (DNI)
        const config = {
            fps: 15,
            qrbox: { width: 300, height: 200 },
            aspectRatio: 1.777,
            formatsToSupport: [
                Html5QrcodeSupportedFormats.PDF_417,
                Html5QrcodeSupportedFormats.CODE_128
            ]
        };

        await scanner.start(cameraId, config, onScanSuccess, onScanFailure);
        document.getElementById("output").innerText = "Apunte al código del DNI...";

    } catch (err) {
        scanning = false;
        document.getElementById("output").innerText = "Error: " + err;
    }
}

function stopScanner(){
    if(scanner && scanning){
        scanner.stop().then(()=>{
            scanning = false;
            lastResult = ""; 
            document.getElementById("output").innerText = "Scanner detenido";
        });
    }
}
</script>

</body>
</html>
