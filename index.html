<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Scanner Code128 PRO</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{
    margin:0;
    background:#0b2a4a;
    color:white;
    font-family:Arial;
    text-align:center;
}

h1{
    font-size:20px;
    margin:15px;
}

#reader{
    width:100%;
    max-width:450px;
    margin:auto;
    border-radius:10px;
    overflow:hidden;
}

button{
    padding:12px 18px;
    margin:10px 5px;
    border:none;
    border-radius:8px;
    font-size:16px;
    background:#1e88e5;
    color:white;
    cursor:pointer;
}

button:active{
    background:#1565c0;
}

.result{
    margin:15px;
    padding:12px;
    background:#123a63;
    border-radius:8px;
    font-size:18px;
    word-break:break-all;
}
</style>
</head>

<body>

<h1>Scanner PRO Code128</h1>

<div id="reader"></div>

<button onclick="startScanner()">📷 Iniciar</button>
<button onclick="stopScanner()">⛔ Stop</button>

<div class="result" id="output">
Resultado: -
</div>

<script>
let scanner;
let scanning = false;
let lastResult = "";

// Unificamos el éxito en una sola función organizada
function onScanSuccess(decodedText){
    if(!decodedText) return;

    // Filtro anti duplicados
    if(decodedText === lastResult) return;

    // Filtro anti basura (Letras, números y guiones entre 4 y 40 caracteres)
    if(!/^[A-Z0-9\-]{4,40}$/i.test(decodedText)) return;

    lastResult = decodedText;

    // Actualizar interfaz
    document.getElementById("output").innerText = "Resultado: " + decodedText;

    // Feedback visual y táctil (Vibración)
    if(navigator.vibrate){
        navigator.vibrate(120);
    }

    // Audio de confirmación rápido (Beep nativo generado por el navegador)
    playBeep();

    console.log("Código detectado:", decodedText);

    // Enviar datos a Google Apps Script
    fetch("https://script.google.com/macros/s/AKfycbz1V555JQEXKW2lYQ-eVqWoXLaijVH4bthANLYdhWUzrsgtCkit0rZukCwgNP_9oEz2/exec", {
        method: "POST",
        mode: "no-cors", // Recomendado para evitar problemas de CORS con Google Apps Script
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            codigo: decodedText
        })
    })
    .then(() => console.log("Enviado con éxito"))
    .catch(err => console.error("Error al enviar:", err));
}

function onScanFailure(error){
    // Silencioso para evitar saturar la consola del navegador
}

// Generador de Beep nativo (no depende de un archivo .mp3/.ogg externo)
function playBeep() {
    try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();

        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(800, audioCtx.currentTime); // Tono del beep
        gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime); // Volumen

        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        oscillator.start();
        oscillator.stop(audioCtx.currentTime + 0.1); // Duración: 100ms
    } catch (e) {
        console.log("No se pudo reproducir el audio de forma nativa", e);
    }
}

async function startScanner(){
    if(scanning) return;
    scanning = true;

    document.getElementById("output").innerText = "Iniciando cámara...";
    scanner = new Html5Qrcode("reader");

    const config = {
        fps: 20,
        qrbox: {
            width: 280,
            height: 120
        },
        aspectRatio: 1.777,
        disableFlip: true,
        formatsToSupport: [
            Html5QrcodeSupportedFormats.CODE_128
        ],
        experimentalFeatures: {
            useBarCodeDetectorIfSupported: true
        }
    };

    try{
        // Cambiado de 'exact: "environment"' a 'facingMode: "environment"' para mayor compatibilidad
        await scanner.start(
            { facingMode: "environment" },
            config,
            onScanSuccess,
            onScanFailure
        );

        document.getElementById("output").innerText = "Scanner activo";
    }catch(err){
        console.log(err);
        scanning = false;
        document.getElementById("output").innerText = "Error cámara: " + err;
    }
}

function stopScanner(){
    if(scanner && scanning){
        scanner.stop()
        .then(()=>{
            scanner.clear();
            scanning = false;
            lastResult = ""; // Limpiamos el último resultado para poder volver a escanearlo si se reinicia
            document.getElementById("output").innerText = "Scanner detenido";
        })
        .catch(err=>{
            console.log(err);
        });
    }
}
</script>

</body>
</html>
