<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.2">

<script src="https://unpkg.com/html5-qrcode@2.3.10/minified/html5-qrcode.min.js"></script>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Arial;background:linear-gradient(180deg,#012b63,#023b86);color:#fff;display:flex;justify-content:center;padding:15px}

.card{width:100%;max-width:440px;background:rgba(255,255,255,0.08);backdrop-filter:blur(10px);border-radius:25px;padding:20px}

input,textarea,select{width:100%;padding:14px;border-radius:15px;border:none;margin-top:5px}
button{width:100%;padding:14px;border:none;border-radius:15px;font-weight:bold;cursor:pointer}

.btn-login{background:#0d6efd}
.btn-save{background:#0ea85d}
.btn-clear{background:#444}

#pantallaScanner{display:none}
#reader{width:100%}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login" class="card">
<h2>LOGIN</h2>

<select id="desplegableUsuario" onchange="usuario.value=this.value"></select>
<input type="hidden" id="usuario">
<input type="password" id="clave">

<button class="btn-login" onclick="login()">Entrar</button>
</div>

<!-- FORM -->
<div id="form" class="card" hidden>

<h3 id="op"></h3>

<button onclick="openScanner()">ESCANEAR DNI</button>

<div id="pantallaScanner">
<div id="reader"></div>
<button class="btn-clear" onclick="closeScanner()">CANCELAR</button>
</div>

<input id="dni" placeholder="DNI">
<input id="apellido" placeholder="Apellido">
<input id="nombre" placeholder="Nombre">
<input id="patente" placeholder="Patente">
<input id="fechaNacimiento" placeholder="DD/MM/AAAA">
<textarea id="obs"></textarea>

<button class="btn-save" onclick="save()">GUARDAR</button>
<button class="btn-clear" onclick="clearForm()">LIMPIAR</button>

</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbxHXImBY4yjON3xmFGgPZQbpU_MsySDGrGOlbSlY9dfa8yqp6Lw90DQRVsxkmSn6eIbQA/exec";

let userActive="";
let lat="",lng="";
let scanner=null;
let scanning=false;
let last=0;

/* API */
async function api(a,d={}){
  const r=await fetch(API+"?accion="+a,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify(d)
  });
  return r.json();
}

/* INIT */
window.onload=async()=>{
  const d=await api("usuarios");
  desplegableUsuario.innerHTML=d.usuarios.map(u=>`<option>${u}</option>`).join("");
};

/* LOGIN */
async function login(){
  const u=usuario.value, p=clave.value;
  const r=await api("login",{usuario:u,clave:p});
  if(!r.valido) return alert("Login incorrecto");

  userActive=u;
  op.textContent=u;

  login.hidden=true;
  form.hidden=false;
}

/* SCANNER */
async function openScanner(){
  pantallaScanner.style.display="block";

  const cams=await Html5Qrcode.getCameras().catch(()=>[]);
  if(!cams.length) return;

  const back=cams.find(c=>/back|rear/i.test(c.label))?.id||cams[0].id;

  if(!scanner) scanner=new Html5Qrcode("reader");

  scanning=true;

  scanner.start(back,{fps:12,qrbox:200},onScan)
  .catch(()=>scanning=false);
}

async function closeScanner(){
  pantallaScanner.style.display="none";
  if(scanner&&scanning){
    scanning=false;
    try{await scanner.stop();}catch(e){}
  }
}

function onScan(t){
  const now=Date.now();
  if(now-last<1200)return;
  last=now;

  if((t.match(/@/g)||[]).length!==8)return;

  navigator.vibrate?.(120);

  const d=t.split("@");

  dni.value=d[4]||"";
  apellido.value=d[1]||"";
  nombre.value=d[2]||"";

  closeScanner();
}

/* GPS */
function gps(){
  return new Promise(r=>{
    navigator.geolocation.getCurrentPosition(
      p=>{
        lat=p.coords.latitude;
        lng=p.coords.longitude;
        r(true);
      },
      ()=>r(false)
    );
  });
}

/* SAVE */
async function save(){

  if(!dni.value||!apellido.value||!nombre.value||!patente.value)
    return alert("Faltan datos");

  await gps();

  const r=await api("guardar",{
    usuario:userActive,
    dni:dni.value,
    apellido:apellido.value,
    nombre:nombre.value,
    patente:patente.value,
    observacion:obs.value,
    latitud:lat,
    longitud:lng
  });

  if(r.ok){
    clearForm();
    alert("Guardado OK");
  }
}

/* CLEAR */
function clearForm(){
  dni.value=apellido.value=nombre.value=patente.value=obs.value="";
}
</script>

</body>
</html>
